<!DOCTYPE html>

<!-- OPTIMAL RESOLUTION: 1920x1080 -->

<html>

<head>
    <title>zunderstream Flying Image Screensaver</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
        }

        #container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flying-image {
            position: fixed;
            min-height: 32px;
            max-height: 32px;
            margin: auto;
            transform: translate(0, 0) scale(0);
            image-rendering: pixelated;
            transition: 3s ease-in;
        }
    </style>
</head>

<body>
    <div id="container">

    </div>
    <script>
        const IMAGE_NAMES = [
            "bean_32x32.png",
            "loaf_32x32.png",
            "sleepy_64x64.png",
            "wow_32x32.png",
            "wut_48x48.png"
        ];

        function getRandomImageName() {
            return `./images/win98/${IMAGE_NAMES[Math.floor(Math.random() * IMAGE_NAMES.length)]}`;
        }

        function addNewImage() {
            const elemId = self.crypto.randomUUID();
            const newImageElem = document.createElement("img");
            newImageElem.id = elemId;
            newImageElem.src = getRandomImageName();
            newImageElem.classList.add("flying-image");

            document.getElementById("container").appendChild(newImageElem);

            const randX = Math.floor(Math.random() * 1000) + 100;
            const negativeX = Math.random() > 0.5;

            const randY = Math.floor(Math.random() * 600) + 100;
            const negativeY = Math.random() > 0.5;

            setTimeout(() => {
                document.getElementById(elemId).style.transform = `translate(${negativeX ? "-" : ""}${randX}px, ${negativeY ? "-" : ""}${randY}px) scale(4)`;
            }, 50);

            setTimeout(() => {
                document.getElementById(elemId).style.opacity = "0";
            }, 2500);

            setTimeout(() => {
                document.getElementById(elemId).remove();
            }, 3000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setInterval(() => {
                addNewImage();
            }, 150);
        });
    </script>
</body>

</html>
