<!DOCTYPE html>

<!-- OPTIMAL RESOLUTION: 1920x1080 -->

<html>

<head>
    <title>zunderstream Windows 98</title>
    <link rel="stylesheet" type="text/css" href="./styles/win98.css" />
    <style type="text/css">
        #shutdown-window {
            position: fixed;
            top: 100px;
            left: calc(50% - 160px);
            width: 320px;
        }
    </style>
    <script src="./scripts/reconnecting-websocket.js"></script>
    <script src="./scripts/zunderstream-base.js"></script>
</head>

<body>
    <div id="desktop"></div>

    <div id="shutdown-window" class="window">
        <div class="title-bar">
            <div class="title-bar-wrapper">
                <div class="title-bar-text">
                    <span id="window-stream-title">zunderstream Ending</span>
                </div>
            </div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body centered-content" style="padding: 8px 0;">
            <div>
                <img src="./images/win98/sleepy_64x64.png" style="height: 32px; vertical-align: middle; margin-right: 8px;">
                It is now safe to turn off the zunderstream.
            </div>
            <div style="margin-top: 16px;">
                <button class="focused">Raid Out</button>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        function setDesktopBackground(background) {
            document.getElementById("desktop").style.background = background;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const background = await getZunderstreamPropertyValue(win98DesktopBackgroundPropertyName);

            if (!!background?.length) {
                setDesktopBackground(background);
            }

            zunderstreamEvents.on(zunderstreamPropertyUpdatedEventName, (data) => {
                if (data.property === win98DesktopBackgroundPropertyName) {
                    setDesktopBackground(data.value);
                }
            });
        });
    </script>
</body>

</html>
