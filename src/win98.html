<!DOCTYPE html>

<!-- OPTIMAL RESOLUTION: 1920x1080 -->

<html>

<head>
    <title>zunderstream Windows 98</title>
    <link rel="stylesheet" type="text/css" href="./styles/shared.css" />
    <link rel="stylesheet" type="text/css" href="./styles/win98.css" />
    <style type="text/css">
        #desktop {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-size: cover;
            background-position: center;
            background: #008081;
        }

        #discord-active-desktop {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 300px;
            background-color: #000;
        }

        #discord-active-desktop img {
            width: 100%;
        }
    </style>
    <script src="./scripts/reconnecting-websocket.js"></script>
    <script src="./scripts/zunderstream-base.js"></script>
</head>

<body>
    <div id="desktop"></div>

    <div id="discord-active-desktop" class="hidden">
        <img src="./images/win98/voice_header.png">
    </div>

    <script type="text/javascript">
        function setDesktopBackground(background) {
            document.getElementById("desktop").style.background = background;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            zunderstreamEvents.on(zunderstreamWin98SetDesktopBackgroundEventName, (data) => {
                setDesktopBackground(data);
            });
        });
    </script>
</body>

</html>
